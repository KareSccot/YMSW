# 前端 SPA nginx 配置 —— ArgoCD/K8s 部署路径
#
# 适用场景：
#   - 前端 SPA（Vue3 + Vite）通过 nginx 容器 serve 静态文件
#   - ArgoCD/K8s 部署，SSL 在 ingress 层终止（容器内只跑 HTTP）
#
# 关键点：
#   - try_files $uri $uri/ /index.html —— SPA 路由回退
#     本项目当前用 createWebHashHistory（hash 路由，URL 带 #），
#     路由不发给服务器请求路径，此回退当前用不上；
#     保留作为兜底：万一以后切到 createWebHistory 不会再 404。
#   - 静态资源长缓存（hash 文件名，可安全 immutable）
#   - index.html 不缓存（确保用户拿到最新入口）
#   - API 反代占位（按需取消注释，填后端 service 地址）
#     本项目 axios baseURL 为 '/'，请求走 /api/apptech-srm-server/*，
#     若后端是 K8s 内 service，取消下面 /api/ 段注释并填 service 地址。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退 —— 前端路由刷新不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（js/css 带 hash 文件名，可 immutable）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（确保用户拿到最新入口文件）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反代占位 —— 按需取消注释，填后端 K8s service 地址
    # location /api/ {
    #     proxy_pass http://<backend-service>.<namespace>.svc.cluster.local:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
