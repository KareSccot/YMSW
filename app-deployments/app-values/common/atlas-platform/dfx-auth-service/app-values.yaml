app:
  name: dfx-auth-service

image:
  namespace: atlas
  repository: dfx-auth-service
  pullPolicy: Always

imagePullSecrets:
  - name: dfx-sciwriter-image-pull-secret

pod:
  port: 8081

livenessProbe:
  tcpSocket:
    port: 8081
  initialDelaySeconds: 90
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  tcpSocket:
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 5
  failureThreshold: 3