# Reference snapshot. Runtime source of truth: devops/app-deployments.
app:
  name: ariba-middleware

image:
  registry: cld93-ld-tcr-premium-sh-001.tencentcloudcr.com
  namespace: ariba-mw-srmp
  repository: ariba-middleware
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: false

service:
  type: ClusterIP
  port: 9090

pod:
  port: 9090

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

tolerations: []
affinity: {}

env:
  JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai"
  SERVER_PORT: "9090"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  MYBATIS_PLUS_CONFIGURATION_LOG_IMPL: "org.apache.ibatis.logging.stdout.StdOutImpl"
  LOGGING_FILE_PATH: "/data/applogs"
