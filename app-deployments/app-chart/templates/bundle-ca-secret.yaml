{{- if and .Values.bundle.enabled .Values.bundle.tls.caCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app-chart.bundleCASecretName" . }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: |
    {{- .Values.bundle.tls.caCert | nindent 4 }}
{{- end }}
