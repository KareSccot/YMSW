apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-chart.fullname" . }}
  labels:
    {{- include "app-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.bundle.enabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.bundle.enabled }}
        checksum/bundle-config: {{ include (print $.Template.BasePath "/bundle-configmap.yaml") . | sha256sum }}
        checksum/bundle-auth: {{ include (print $.Template.BasePath "/bundle-secret.yaml") . | sha256sum }}
        {{- if .Values.bundle.tls.caCert }}
        checksum/bundle-ca: {{ include (print $.Template.BasePath "/bundle-ca-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "app-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- range .Values.imagePullSecrets }}
        - name: {{ .name }}
      {{- end }}
      {{- end }}
      serviceAccountName: {{ include "app-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "app-chart.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or .Values.args .Values.bundle.enabled }}
          args:
            {{- with .Values.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.bundle.enabled }}
            - "--config-file=/etc/opa/config/opa-config.yaml"
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.pod.port }}
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
            {{- if .Values.envFromSecret.enabled }}
            {{- range $key, $ref := .Values.envFromSecret.keys }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.name }}
                  key: {{ $ref.key | default $key }}
            {{- end }}
            {{- end }}
          {{- if and .Values.envFromSecret.enabled (not .Values.envFromSecret.keys) }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret.name }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.bundle.enabled }}
          readinessProbe:
            httpGet:
              path: /health?bundles
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          {{- else }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.bundle.enabled }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.bundle.enabled }}
            - name: bundle-config
              mountPath: /etc/opa/config
              readOnly: true
            - name: bundle-auth
              mountPath: /var/run/secrets/opa-bundle-auth
              readOnly: true
            {{- if or .Values.bundle.tls.caCert .Values.bundle.tls.existingSecret.name }}
            - name: bundle-ca
              mountPath: /etc/opa/tls
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.bundle.enabled }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.bundle.enabled }}
        - name: bundle-config
          configMap:
            name: {{ include "app-chart.bundleConfigMapName" . }}
        - name: bundle-auth
          secret:
            secretName: {{ if .Values.bundle.auth.existingSecret }}{{ .Values.bundle.auth.existingSecret }}{{ else }}{{ include "app-chart.bundleAuthSecretName" . }}{{ end }}
            items:
              - key: basic-auth
                path: basic-auth
        {{- if or .Values.bundle.tls.caCert .Values.bundle.tls.existingSecret.name }}
        - name: bundle-ca
          secret:
            secretName: {{ default (include "app-chart.bundleCASecretName" .) .Values.bundle.tls.existingSecret.name }}
            items:
              - key: {{ default "ca.crt" .Values.bundle.tls.existingSecret.key }}
                path: ca.crt
        {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
