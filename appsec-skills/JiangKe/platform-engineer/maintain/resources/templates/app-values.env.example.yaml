# ArgoCD CD 配置 —— 环境覆盖（每环境一份）
#
# 适用场景：
#   - 前端 SPA 项目走 ArgoCD + K8s 部署
#   - 放在 app-deployments 仓库的 app-values/<env>/<team>/<app>/<env>-<region>.yaml
#   - 如 uat/ariba/ariba-srmp-ui/uat-sh.yaml
#
# 与通用骨架的关系：
#   - 只覆盖 env 相关的值，骨架由 common/app-values.yaml 提供
#   - image.tag 是 CI↔CD 握手点：CI push 镜像到 TCR 后，这里改 tag 触发 ArgoCD 更新

app:
  env: <ENV>

image:
  tag: "<IMAGE_TAG>"

replicaCount: 2

env:
  # 后端 API 地址（K8s service 名 + 端口，不是外部 URL）
  BACKEND_API_URL: "http://<BACKEND_SERVICE>.<NAMESPACE>.svc.cluster.local:<BACKEND_PORT>"
  # 前端监听端口（跟 common 里的 pod.port 对齐）
  APP_PORT: "80"