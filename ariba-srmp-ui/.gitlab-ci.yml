# ariba/ariba-srmp-ui 的 .gitlab-ci.yml
# include ariba 组级前端 workflow（team-cicd feat/ariba 分支）
include:
  - project: 'devops/team-cicd'
    ref: feat/ariba
    file: '/ariba/frontend-workflow.yml'

# Override deploy-uat to trigger on UAT branch (default branch is Master)
deploy-uat:
  variables:
    ENV: uat
  stage: deploy-uat
  when: manual
  extends:
    - .deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "UAT"'
      when: manual
    - when: never
  needs: 
    - build-container