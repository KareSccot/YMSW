spring:
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 66MB

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mailbox-binding-approval-path: ${MAILBOX_BINDING_APPROVAL_PATH:/approvals}
  master-data-reference-sync:
    enabled: ${MASTER_DATA_REFERENCE_SYNC_ENABLED:true}
    cron: "${MASTER_DATA_REFERENCE_SYNC_CRON:0 0 2 * * *}"
    zone: ${MASTER_DATA_REFERENCE_SYNC_ZONE:Asia/Shanghai}
  template-assets:
    image-dir: ${TEMPLATE_IMAGE_DIR:/Users/yaoshuteng/Desktop/BIO/work/RecognitionPlatform/assets/uploads}
  security:
    replay:
      enabled: ${REPLAY_PROTECTION_ENABLED:true}
      timestamp-window-ms: ${REPLAY_TIMESTAMP_WINDOW_MS:300000}
      max-nonces: ${REPLAY_NONCE_MAX_ENTRIES:10000}
