include:
  - local: jobs/deploy/vm-deploy.yml
  - local: rules/dev-fix-rules.yml
  - local: rules/uat-rules.yml
  - local: rules/release-rules.yml


deploy-container-uat:
  variables:
    ENV: uat
    DOCKER_COMPOSE_FILE: "./docker-compose.yml"
    SSH_TARGET: "${UAT_SSH_TARGET}"
    SSH_PRIVATE_KEY: "${UAT_SSH_PRIVATE_KEY}"
    SSH_USER: "${UAT_SSH_USER}"
    SSH_PORT: "${UAT_SSH_PORT}"
    SSL_CERT: "${UAT_SSL_CERT}"
    SSL_KEY: "${UAT_SSL_KEY}"
    DEPLOY_PATH: "${UAT_DEPLOY_PATH}"
  stage: deploy-uat
  when: manual
  extends:
    - .deploy_container
    - .default_dev_fix_docker_rules
  needs:
    - build-container

deploy-container-prod:
  variables:
    ENV: prod
    DOCKER_COMPOSE_FILE: "./docker-compose.yml"
    SSH_TARGET: "${PROD_SSH_TARGET}"
    SSH_PRIVATE_KEY: "${PROD_SSH_PRIVATE_KEY}"
    SSH_USER: "${PROD_SSH_USER}"
    SSH_PORT: "${PROD_SSH_PORT}"
    SSL_CERT: "${PROD_SSL_CERT}"
    SSL_KEY: "${PROD_SSL_KEY}"
    DEPLOY_PATH: "${PROD_DEPLOY_PATH}"
  stage: deploy-prod
  when: manual
  allow_failure: false
  extends:
    - .deploy_container
    - .release_rules
  needs:
    - build-container