# carbon-platform CI 配置（Go + K3s/ArgoCD 部署）
# 生成依据：user-cicd skill gitlab-ci-gen 模块 + esg-server (feat/cicd-template) 参考实现
# 决策记录：
#   - 复用 smart-esg 的 backend-workflow.yml（owner 拍板）
#   - 环境两套：UAT + PROD（owner 拍板）
#   - Go 语言，编译在 Dockerfile 多阶段构建内完成：
#     不设 BUILD_TOOL、保持 build-app 禁用（smart-esg workflow 已默认禁）
#   - 部署走 ArgoCD（smart-esg workflow 默认 DEPLOY_CONTAINER=false，
#     即禁 VM docker-compose 部署，K3s 集群在 ArgoCD 体系后面）
#   - CD 侧（ArgoCD app / K3s 部署清单）不在 CI 接入范围，归 smart-esg 组/平台工程师
#
# BUILD_CONTAINER="true"：re-enable build-container job
#（team-cicd 默认 $BUILD_CONTAINER != "true" -> when:never；
#  esg-server 走 GitLab 项目级 Variables 配的这个值，这里显式写进文件更自包含）

include:
  - project: 'devops/team-cicd'
    ref: Master
    file: '/smart-esg/backend-workflow.yml'

variables:
  BUILD_CONTAINER: "true"
  BUILD_FOLDER: "."

build-container:
  variables:
    IMAGE_NAME: carbon-platform
    PACKAGE_NAME: carbon-platform
    BUILD_FOLDER: "."
    DOCKER_BUILD_PATH: "."
    DOCKERFILE_NAME: "./Dockerfile"
    SERVICE_PORT: "8080"
    # Go 无 Maven artifact，ARTIFACT_FOLDER 为模板兼容字段，多阶段构建不使用
    ARTIFACT_FOLDER: "."
