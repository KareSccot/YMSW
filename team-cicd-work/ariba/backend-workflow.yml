include:
  - project: 'devops/cicd-template'
    ref: feat/build_prod_image
    file: '/workflows/app-workflow.yml'

variables:
  # deploy using argocd instead of container
  DEPLOY_CONTAINER: "false"

build-app:
  image: cld93-ld-tcr-premium-sh-001.tencentcloudcr.com/devops/jdk21.0.11_10-jdk-ubi9-minimal_mvn3.9.6:feat-ariba-144059
  variables:
    # update below default variables in each service's yml file if necessary
    #BUILD_ENV: 'mvn_build_env'
    #BUILD_FOLDER: 'pom_file_folder'
    #ARTIFACT_FOLDER: 'artifact_target_folder_relative_to_build_folder'
    # update above default variables in each service's yml file
    BUILD_FOLDER: "."
    ARTIFACT_FOLDER: ./build/libs
    BUILD_ENV: "change_me"

build-container:
  variables:
    DOCKER_BUILD_PATH: '.'
    # update below default variables in each service's yml file
    #BUILD_FOLDER: 'pom_file_folder'
    #ARTIFACT_FOLDER: 'artifact_target_folder_relative_to_docker_build_path'
    #IMAGE_NAME: "define_me"
    #SERVICE_PORT: 0000
    # update above default variables in each service's yml file
    BUILD_FOLDER: "."
    ARTIFACT_FOLDER: ./build/libs
    SERVICE_PORT: 8080
    PACKAGE_NAME: ${IMAGE_NAME}
    DOCKER_BUILD_ARGS: "--build-arg BUILD_FOLDER=${BUILD_FOLDER} --build-arg ARTIFACT_FOLDER=${ARTIFACT_FOLDER} --build-arg PACKAGE_NAME=${PACKAGE_NAME} --build-arg SERVICE_PORT=${SERVICE_PORT}"

deploy-dev:
  rules:
    - when: never

deploy-uat:
    needs:
      - build-container
    rules:
    - if: $CI_COMMIT_BRANCH == "UAT"
    - when: never

deploy-container-uat:
  rules:
    - when: never

DockerScan:
  rules:
    - if: $CI_COMMIT_BRANCH == "UAT"
    - when: never

SCA:
  rules:
    - if: $CI_COMMIT_BRANCH == "UAT"
    - when: never

ThreatModeling:
  rules:
    - if: $CI_COMMIT_BRANCH == "UAT"
    - when: never

GenSecurityReport:
  rules:
    - if: $CI_COMMIT_BRANCH == "UAT"
    - when: never

.conditions_for_uat:
  rules:
    - if: $CI_COMMIT_BRANCH == "UAT"

default:
  tags:
  - tencent
  - mno
  - shared
  - platform

