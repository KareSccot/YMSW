# This flow is the base flow for application
include:
  - local: stages/preparations.yml
  - local: stages/container-build.yml
  - local: stages/build.yml
  - local: stages/argo-deploy.yml
  - local: stages/docker-deploy.yml
  - local: stages/approval.yml
  # - local: stages/sonar-scan.yml
  - local: stages/security-scan.yml
  # - local: stages/release.yml

stages:
  - build
  - test
  - quality
  - security-report
  - deploy-dev
  - deploy-uat
  - create-release
  - approval
  - deploy-prod
  - finalize-release

# default variables
variables:
  SERVICE_NAME: "${CI_PROJECT_NAME}"

default:
  tags:
    - platform
    - tencent
    - devops

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
