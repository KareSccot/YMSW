apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opa-service.fullname" . }}
  labels:
    {{- include "opa-service.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "opa-service.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      {{- if .Values.bundle.enabled }}
      annotations:
        checksum/bundle-config: {{ include (print $.Template.BasePath "/bundle-configmap.yaml") . | sha256sum }}
        checksum/bundle-auth: {{ include (print $.Template.BasePath "/bundle-secret.yaml") . | sha256sum }}
        {{- if .Values.bundle.tls.caCert }}
        checksum/bundle-ca: {{ include (print $.Template.BasePath "/bundle-ca-secret.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "opa-service.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "opa-service.serviceAccountName" . }}

      containers:
        - name: opa

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            {{- if .Values.bundle.enabled }}
            - "--config-file=/etc/opa/config/opa-config.yaml"
            {{- end }}

          ports:
            - name: http
              containerPort: 8181
              protocol: TCP

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- if .Values.bundle.enabled }}
          readinessProbe:
            httpGet:
              path: /health?bundles
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          volumeMounts:
            - name: bundle-config
              mountPath: /etc/opa/config
              readOnly: true
            - name: bundle-auth
              mountPath: /var/run/secrets/opa-bundle-auth
              readOnly: true
            {{- if or .Values.bundle.tls.caCert .Values.bundle.tls.existingSecret.name }}
            - name: bundle-ca
              mountPath: /etc/opa/tls
              readOnly: true
            {{- end }}
          {{- end }}

      {{- if .Values.bundle.enabled }}
      volumes:
        - name: bundle-config
          configMap:
            name: {{ include "opa-service.bundleConfigMapName" . }}
        - name: bundle-auth
          secret:
            secretName: {{ include "opa-service.bundleAuthSecretName" . }}
            items:
              - key: basic-auth
                path: basic-auth
        {{- if or .Values.bundle.tls.caCert .Values.bundle.tls.existingSecret.name }}
        - name: bundle-ca
          secret:
            secretName: {{ default (include "opa-service.bundleCASecretName" .) .Values.bundle.tls.existingSecret.name }}
            items:
              - key: {{ default "ca.crt" .Values.bundle.tls.existingSecret.key }}
                path: ca.crt
        {{- end }}
      {{- end }}
